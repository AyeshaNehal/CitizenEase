version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: citizenease-db
    environment:
      POSTGRES_USER: citizenease
      POSTGRES_PASSWORD: citizenease_secret
      POSTGRES_DB: citizenease_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/app/db/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citizenease -d citizenease_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: citizenease-backend
    environment:
      - DATABASE_URL=postgresql://citizenease:citizenease_secret@db:5432/citizenease_db
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: citizenease-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
